# fly.toml — Trading Bot
# Generado para Fly.io free tier (shared-cpu-1x, 256 MB RAM)

app = "tomas-bot-trading"
primary_region = "fra"       # Frankfurt — Binance no bloquea IPs cloud europeas

[build]
  dockerfile = "Dockerfile"

[env]
  TRADING_MODE = "testnet"

# ── Servicio HTTP (dashboard) ────────────────────────────────────────────────
[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = false   # CRÍTICO: mantiene el bot corriendo 24/7
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

# ── Recursos de la VM ────────────────────────────────────────────────────────
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# ── Volumen persistente (SQLite + logs) ──────────────────────────────────────
[[mounts]]
  source      = "bot_data"
  destination = "/app/data"
